services:
  app:
    build:
      context: .
      target: final
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - gazette-output:/data
    restart: "no"
    environment:
      DATABASE_URL: postgresql://gazette:gazette-local-only@postgres:5432/gazette
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: gazette
      POSTGRES_USER: gazette
      # Identifiants de développement, sans port publié sur l'hôte.
      POSTGRES_PASSWORD: gazette-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazette -d gazette"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    network_mode: none

  prefect-server:
    image: prefecthq/prefect:3.9.0-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  collecteur:
    build:
      context: .
      target: final
    command: ["python", "-m", "gazette.flows"]
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gazette:gazette-local-only@postgres:5432/gazette
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_HOME: /tmp/prefect
      PREFECT_LOGGING_EXTRA_LOGGERS: gazette
      # Webhook Discord/Slack des alertes qualité, lu depuis .env (jamais commité).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - gazette-output:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
  gazette-output:
  prefect-data:
