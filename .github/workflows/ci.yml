name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: gazette_test
          POSTGRES_USER: gazette
          POSTGRES_PASSWORD: gazette-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gazette -d gazette_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer les dépendances figées
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps .
      - name: Lint et tests hors réseau éditeur
        env:
          TEST_DATABASE_URL: postgresql://gazette:gazette-ci-only@localhost:5432/gazette_test
        run: bin/check

  image:
    name: Build et publication GHCR
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Définir le tag UTC et la provenance
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          tag="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "ref=$name:$tag" >> "$GITHUB_OUTPUT"
      - name: Construire l'image finale
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker build --target final \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_REF" .
      - name: Vérifier l'image construite
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          test "$(docker run --rm --network none "$IMAGE_REF" id -u)" = "10001"
          docker run --rm --network none "$IMAGE_REF" sh -c \
            'python -m gazette && python -c "import json; assert len(json.load(open(\"/data/items.json\"))) == 2"'
      - name: Publier la même image sur chaque push
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker push "$IMAGE_REF"
          echo "Image publiée : \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Fermer la session du registre
        if: always() && github.event_name == 'push'
        run: docker logout ghcr.io
