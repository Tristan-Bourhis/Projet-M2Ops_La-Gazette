name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: gazette_test
          POSTGRES_USER: gazette
          POSTGRES_PASSWORD: gazette-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gazette -d gazette_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer les dépendances figées
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps .
      - name: Lint et tests hors réseau éditeur
        env:
          TEST_DATABASE_URL: postgresql://gazette:gazette-ci-only@localhost:5432/gazette_test
        run: bin/check

  image:
    name: Build et publication GHCR
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Définir le tag UTC et la provenance
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          tag="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "ref=$name:$tag" >> "$GITHUB_OUTPUT"
      - name: Construire l'image finale
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker build --target final \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_REF" .
      - name: Vérifier l'image construite
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          test "$(docker run --rm --network none "$IMAGE_REF" id -u)" = "10001"
          docker run --rm --network none "$IMAGE_REF" sh -c \
            'python -m gazette && python -c "import json; assert len(json.load(open(\"/data/items.json\"))) == 2"'
      - name: Publier la même image sur chaque push
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker push "$IMAGE_REF"
          echo "Image publiée : \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Fermer la session du registre
        if: always() && github.event_name == 'push'
        run: docker logout ghcr.io

  evaluation-local:
    name: Calcul des métriques sur les données d’hier
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: [self-hosted, gazette-production]
    timeout-minutes: 30
    concurrency:
      group: gazette-local
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Évaluer dans une copie PostgreSQL jetable
        run: sh bin/evaluate-ci
      - name: Résumé public sans textes de presse
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          path = Path('evaluation.jsonl')
          if path.exists() and path.stat().st_size:
              run = json.loads(path.read_text().splitlines()[0])
              report = {k: run[k] for k in ('run_id', 'nb_articles', 'metriques')}
              report['evaluation'] = {k: v for k, v in run['evaluation'].items() if k != 'echantillon'}
              Path('evaluation-resume.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-hier
          path: evaluation-resume.json
      - name: Nettoyer le corpus du workspace
        if: always()
        run: rm -f evaluation.jsonl

  evaluation:
    name: Évaluation hier
    if: always() && github.event_name == 'pull_request'
    needs: [quality, evaluation-local]
    runs-on: ubuntu-latest
    steps:
      - name: Exiger une évaluation réelle réussie
        env:
          RESULT: ${{ needs.evaluation-local.result }}
        run: test "$RESULT" = success

  deploy-model:
    name: Promotion et déploiement
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [quality, image]
    runs-on: [self-hosted, gazette-production]
    environment: production
    concurrency:
      group: gazette-local
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Réévaluer le commit fusionné, promouvoir et déployer
        run: sh bin/deploy-model
